name: Production Smoke Test

on:
  workflow_dispatch:
  # Canlı API'yi her sabah 06:00'da (TSİ, UTC+3) kendiliğinden doğrula.
  # Zamanlanmış çalışma başarısız olursa GitHub e-posta bildirimi gönderir;
  # Render'daki veritabanı kesintisi bu kontrol olmadığı için iki ay fark edilmedi.
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # apps/api'ye dokunan son commit'i bulabilmek için tam geçmiş.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Render yalnızca apps/api değiştiğinde yeniden dağıtır. Bu yüzden canlıda
      # main'in son commit'i değil, apps/api'ye dokunan son commit çalışmalıdır.
      # Bu kontrol, dağıtımın eski bir sürümde takılı kalmasını da yakalar.
      - name: Find expected API revision
        id: revision
        run: |
          sha="$(git log -1 --format=%H -- apps/api)"
          echo "Beklenen API sürümü: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Verify production API
        env:
          SMOKE_BASE_URL: https://islik-cloud-api.onrender.com
          SMOKE_TIMEOUT_MS: "90000"
          SMOKE_EXPECTED_GIT_COMMIT: ${{ steps.revision.outputs.sha }}
        working-directory: apps/api
        run: npm run smoke:production

